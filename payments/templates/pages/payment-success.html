{% extends "templates/web.html" %}

{% block title %}{{ _("Payment Success") }}{% endblock %}

{%- block page_content -%}
<div class='page-card'>
        <div class='page-card-head'>
                <span class='indicator green'>
                        {{ _("Success") }}</span>
        </div>
        <p>{{ payment_message or _("Your payment was successfully accepted") }}</p>
        <div>
                <a href='/orders' class='btn btn-primary btn-sm'>{{ _("View Orders") }}</a>
                <a href='/invoices' class='btn btn-default btn-sm'>{{ _("View Invoices") }}</a>
        </div>
</div>
<style>
{% include "templates/styles/card_style.css" %}
</style>
{% endblock %}
